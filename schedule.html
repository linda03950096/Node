<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161616" />
  <title>Schedule — 산디종</title>
  <link rel="stylesheet" href="https://use.typekit.net/cbs4srk.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/schedule.css" />
  <script src="js/app.js"></script>
</head>
<body data-tab="schedule">
  <div class="stage"><div class="phone-scaler"><div class="phone">
    <main class="screen screen--pad sched">
      <!-- 배경 지도 -->
      <div class="sched-bg" aria-hidden="true">
        <div class="sched-bg-map"><img src="assets/map/map-bg.png" alt="" /></div>
      </div>

      <div class="sched-body">
        <div class="sched-head" data-enter>
          <h1 class="t-heading-l">Schedule</h1>
          <button class="glass sched-month icon-btn t-small" aria-label="월 선택">Sep<img src="assets/schedule/chevron-down.svg" width="20" height="20" alt="" /></button>
        </div>

        <!-- 달력 -->
        <div class="glass sched-card" data-enter style="animation-delay:.06s">
          <div class="sched-cal">
            <div class="sched-week t-small-m"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
            <div class="sched-days">
            <div class="sched-row">
              <span class="sched-day sched-day--empty"></span>
              <span class="sched-day sched-day--empty"></span>
              <span class="sched-day sched-day--empty"></span>
              <a href="schedule-set.html?d=1" class="sched-day t-small" aria-label="Sep 1">1</a>
              <a href="schedule-set.html?d=2" class="sched-day t-small" aria-label="Sep 2">2</a>
              <a href="schedule-set.html?d=3" class="sched-day t-small" aria-label="Sep 3">3</a>
              <a href="schedule-set.html?d=4" class="sched-day t-small" aria-label="Sep 4">4</a>
            </div>
            <div class="sched-row">
              <a href="schedule-set.html?d=5" class="sched-day t-small" aria-label="Sep 5">5</a>
              <a href="schedule-set.html?d=6" class="sched-day t-small" aria-label="Sep 6">6</a>
              <a href="schedule-set.html?d=7" class="sched-day t-small" aria-label="Sep 7">7</a>
              <a href="schedule-set.html?d=8" class="sched-day t-small" aria-label="Sep 8">8</a>
              <a href="schedule-set.html?d=9" class="sched-day t-small" aria-label="Sep 9">9</a>
              <a href="schedule-set.html?d=10" class="sched-day t-small" aria-label="Sep 10">10</a>
              <a href="schedule-set.html?d=11" class="sched-day t-small" aria-label="Sep 11">11</a>
            </div>
            <div class="sched-row">
              <a href="schedule-set.html?d=12" class="sched-day t-small" aria-label="Sep 12">12</a>
              <a href="schedule-set.html?d=13" class="sched-day t-small" aria-label="Sep 13">13</a>
              <a href="schedule-set.html?d=14" class="sched-day t-small" aria-label="Sep 14">14</a>
              <a href="schedule-set.html?d=15" class="sched-day t-small" aria-label="Sep 15">15</a>
              <a href="schedule-set.html?d=16" class="sched-day t-small" aria-label="Sep 16">16</a>
              <a href="schedule-set.html?d=17" class="sched-day t-small" aria-label="Sep 17">17</a>
              <a href="schedule-set.html?d=18" class="sched-day t-small" aria-label="Sep 18">18</a>
            </div>
            <div class="sched-row">
              <a href="schedule-set.html?d=19" class="sched-day t-small" aria-label="Sep 19">19</a>
              <a href="schedule-set.html?d=20" class="sched-day t-small" aria-label="Sep 20">20</a>
              <a href="schedule-set.html?d=21" class="sched-day t-small" aria-label="Sep 21">21</a>
              <a href="schedule-set.html?d=22" class="sched-day t-small" aria-label="Sep 22">22</a>
              <a href="schedule-set.html?d=23" class="sched-day t-small" aria-label="Sep 23">23</a>
              <a href="schedule-set.html?d=24" class="sched-day t-small" aria-label="Sep 24">24</a>
              <a href="schedule-set.html?d=25" class="sched-day t-small" aria-label="Sep 25">25</a>
            </div>
            <div class="sched-row">
              <a href="schedule-set.html?d=26" class="sched-day t-small" aria-label="Sep 26">26</a>
              <a href="schedule-set.html?d=27" class="sched-day t-small" aria-label="Sep 27">27</a>
              <a href="schedule-set.html?d=28" class="sched-day t-small" aria-label="Sep 28">28</a>
              <a href="schedule-set.html?d=29" class="sched-day t-small" aria-label="Sep 29">29</a>
              <a href="schedule-set.html?d=30" class="sched-day t-small" aria-label="Sep 30">30</a>
              <a href="schedule-set.html?d=31" class="sched-day t-small" aria-label="Sep 31">31</a>
              <span class="sched-day sched-day--empty"></span>
            </div>
            </div>
          </div>
          <img class="sched-divider" src="assets/schedule/divider.svg" width="338" height="0.5" alt="" />
          <div class="sched-foot">
            <div class="sched-times t-small">
              <span class="glass sched-time"><span class="muted">Start</span><b>0:00</b></span>
              <span class="glass sched-time"><span class="muted">Arrive</span><b>0:00</b></span>
            </div>
            <span class="sched-next-off t-small-m" aria-disabled="true">Next</span>
          </div>
        </div>
      </div>
    </main>
  </div></div></div>
</body>
</html>
