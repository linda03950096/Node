<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161616" />
  <title>Map · route + home — 산디종</title>
  <link rel="stylesheet" href="https://use.typekit.net/cbs4srk.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/map-route.css" />
  <script src="js/app.js"></script>
</head>
<body data-tab="schedule">
  <div class="stage"><div class="phone-scaler"><div class="phone">
    <main class="screen mr mr--b">

      <!-- 지도 -->
      <div class="mr-map">
        <div class="rot mr-bg">
          <img src="assets/map/map-bg-wide.png" alt="" />
          <div class="mr-bg-fade"></div>
        </div>
        <div class="mr-route">
          <div class="rot mr-seg1"><img src="assets/map-route/route-b1.svg" alt="" /></div>
          <div class="rot mr-seg2 mr-masked"><img src="assets/map-route/route-b2.svg" alt="" /></div>
        </div>
        <span class="rot mr-dot mr-dot--start"><img src="assets/map-route/dot-start-b.svg" alt="" /></span>
        <span class="rot mr-dot mr-dot--end"><img src="assets/map-route/dot-end-b.svg" alt="" /></span>
        <span class="rot mr-trail mr-trail--1"><img src="assets/map-route/dot-trail-b.svg" alt="" /></span>
        <span class="rot mr-trail mr-trail--2"><img src="assets/map-route/dot-trail-b.svg" alt="" /></span>
        <span class="rot mr-trail mr-trail--3"><img src="assets/map-route/dot-trail-b.svg" alt="" /></span>
        <div class="mr-pin">
          <img src="assets/map-route/pin-b.svg" alt="" />
          <div class="mr-pin-text">
            <span class="t-small-m">Charge Point</span>
            <span class="mr-cap muted">Parkview A3</span>
          </div>
        </div>
      </div>

      <a href="map-route.html" data-back class="mr-back icon-btn" aria-label="뒤로"><img src="assets/map-route/back-btn.svg" alt="" /></a>

      <div class="mr-side">
        <button class="glass mr-side-btn icon-btn" aria-label="경고"><img class="mr-side-warn" src="assets/map-route/btn-warning.svg" width="19.645" height="19.645" alt="" /></button>
        <button class="glass mr-side-btn icon-btn" aria-label="충전소"><img src="assets/map-route/btn-fuel.svg" width="14.55" height="15.716" alt="" /></button>
        <button class="mr-side-btn mr-side-btn--on icon-btn" aria-label="집" aria-pressed="true"><img src="assets/map-route/btn-home-dark.svg" width="28" height="28" alt="" /></button>
      </div>

      <!-- 하단 시트 -->
      <div class="mr-sheet">
        <div class="glass mr-card" data-enter>
          <div class="mr-rows">
            <div class="mr-row">
              <img src="assets/map-route/navigate.svg" width="28" height="28" alt="" />
              <div class="mr-row-text"><span class="t-body">My Location</span><span class="mr-cap muted">Airport P3</span></div>
            </div>
            <div class="mr-row mr-row--cp">
              <span class="mr-row-icon"><img src="assets/map-route/fuel-row.svg" width="14.55" height="15.715" alt="" /></span>
              <div class="mr-row-text"><span class="t-body">Charge Point</span><span class="mr-cap muted">Parkview A3</span></div>
            </div>
            <div class="mr-row">
              <img src="assets/map-route/house-row.svg" width="28.185" height="28" alt="" />
              <div class="mr-row-text"><span class="t-body">Home</span></div>
            </div>
            <button class="mr-add">
              <span class="mr-add-ico"><img src="assets/map-route/plus.svg" width="14.4" height="14.4" alt="" /></span>
              <span class="t-body">Add Stop</span>
            </button>
          </div>
          <img src="assets/map-route/divider.svg" width="338" height="0.5" alt="" />
          <div class="mr-foot">
            <div class="mr-eta">
              <img src="assets/map-route/star.svg" width="12" height="28" alt="" />
              <div class="mr-eta-text"><span class="mr-eta-time">42 min</span><span class="mr-cap muted">11km</span></div>
            </div>
            <a href="payment.html" class="btn-white mr-price">$32.99</a>
          </div>
        </div>
      </div>

    </main>
  </div></div></div>
</body>
</html>
