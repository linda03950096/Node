<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>산디종 — Showcase</title>
  <link rel="stylesheet" href="https://use.typekit.net/cbs4srk.css" />
  <link rel="stylesheet" href="css/showcase.css" />
</head>
<body data-mode="play">

  <!-- 상단 토글: ▶ 영상 / ☰ 스크롤 -->
  <nav class="sc-toggle" role="tablist" aria-label="보기 방식">
    <span class="sc-toggle-thumb" aria-hidden="true"></span>
    <button class="sc-tab" role="tab" data-target="play" aria-selected="true" aria-label="영상 보기">
      <svg width="24" height="26" viewBox="0 0 24 26" aria-hidden="true"><path d="M3 2.2v21.6c0 .9 1 1.5 1.8 1L22 14.1c.8-.5.8-1.6 0-2.1L4.8 1.2C4 .7 3 1.3 3 2.2Z" fill="currentColor"/></svg>
    </button>
    <button class="sc-tab" role="tab" data-target="list" aria-selected="false" aria-label="전체 보기">
      <svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><path d="M0 2h30M0 11h30M0 20h30" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </nav>

  <!-- ▶ 영상 모드 -->
  <section class="sc-play" id="playView" aria-label="영상">
    <img class="sc-logo" src="assets/showcase/logo.svg" alt="산디종" />
    <video class="sc-play-video" id="playVideo" loop playsinline preload="auto"></video>
  </section>

  <!-- 소리 켜기/끄기 (메인 영상이 있을 때만 보임) -->
  <button class="sc-sound" id="soundBtn" hidden aria-label="소리 켜기">
    <svg class="ic-on" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <svg class="ic-off" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>

  <!-- ☰ 스크롤 모드 -->
  <main class="sc-list" id="listView" aria-label="전체 보기">
    <div class="sc-list-inner" id="listInner"></div>
    <p class="sc-empty" id="listEmpty">media 폴더에 이미지·영상을 넣고 showcase-media.js에 순서대로 적어주세요.</p>
  </main>

  <script src="showcase-media.js"></script>
  <script src="js/showcase.js"></script>
</body>
</html>
