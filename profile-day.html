<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161616" />
  <title>History · day — 산디종</title>
  <link rel="stylesheet" href="https://use.typekit.net/cbs4srk.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <script src="js/app.js"></script>
</head>
<body data-tab="profile" data-statusbar="solid">
  <div class="stage"><div class="phone-scaler"><div class="phone">
    <main class="screen screen--pad prof">
      <header class="prof-topbar" data-enter>
        <h1 class="t-heading-l">Profile</h1>
      </header>

      <div class="prof-body">
        <section class="prof-top">
          <!-- 사용자 / 차량 카드 -->
          <div class="prof-cards" data-enter style="animation-delay:.06s">
            <div class="glass prof-card prof-card--user">
              <div class="prof-card-text">
                <span class="t-heading-m">Yeji Han</span>
                <span class="prof-card-sub muted">Node member</span>
              </div>
              <img class="prof-glow prof-glow--day" src="assets/profile/glow-day.svg" width="351.032" height="325.537" alt="" />
              <img class="prof-online" src="assets/profile/online-dot.svg" width="4" height="4" alt="" />
              <img class="prof-dots prof-dots--top" src="assets/profile/dots.svg" width="179" height="345" alt="" />
            </div>
            <div class="prof-card prof-card--car">
              <div class="prof-card-text">
                <span class="t-heading-m">Ioniq 5</span>
                <span class="prof-card-sub prof-sub-dim">Battery 22%</span>
              </div>
              <div class="prof-car">
                <div class="prof-car-main"><img src="assets/home/car.png" alt="Ioniq 5" /></div>
                <div class="prof-car-reflect"><img src="assets/home/car.png" alt="" /></div>
              </div>
            </div>
          </div>

          <!-- 설정 -->
          <div class="glass prof-settings" data-enter style="animation-delay:.12s">
            <button class="prof-row t-small"><span class="prof-ico prof-ico--account"><img src="assets/profile/account.svg" width="11.5703" height="16.3913" alt="" /></span>Account details</button>
            <button class="prof-row t-small"><span class="prof-ico prof-ico--full"><img src="assets/profile/payment.svg" width="28" height="28" alt="" /></span>Payment methods</button>
            <button class="prof-row t-small"><span class="prof-ico prof-ico--bell"><img src="assets/profile/bell.svg" width="13.75" height="14.4791" alt="" /></span>Notifications</button>
            <button class="prof-row t-small"><span class="prof-ico prof-ico--full"><img src="assets/profile/privacy.svg" width="28" height="28" alt="" /></span>Privacy &amp; security</button>
            <button class="prof-row t-small"><span class="prof-ico prof-ico--full"><img src="assets/profile/help.svg" width="28" height="28" alt="" /></span>Help &amp; support</button>
          </div>
        </section>

        <!-- History -->
        <section class="prof-history">
          <div class="prof-history-head" data-enter style="animation-delay:.18s">
            <h2 class="t-heading-m">History</h2>
            <button class="glass prof-month t-small">Month<img src="assets/profile/chevron-down.svg" width="20" height="20" alt="" /></button>
          </div>

          <div class="prof-list">
            <div class="glass prof-week" data-enter style="animation-delay:.22s">
              <div class="prof-weekdays t-small-m"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
              <div class="prof-dates t-small">
                <a class="prof-date" href="profile.html" data-back data-d="12"><span class="prof-date-num">12</span><img src="assets/profile/day-dot.svg" width="32" height="32" alt="" /></a>
                <a class="prof-date" href="profile.html" data-back data-d="13"><span class="prof-date-num">13</span><img src="assets/profile/day-empty.svg" width="32" height="32" alt="" /></a>
                <a class="prof-date" href="profile.html" data-back data-d="14"><span class="prof-date-num">14</span><img src="assets/profile/day-empty.svg" width="32" height="32" alt="" /></a>
                <a class="prof-date is-selected" href="profile.html" data-back data-d="15"><span class="prof-date-num">15</span><img src="assets/profile/day-dot.svg" width="32" height="32" alt="" /></a>
                <a class="prof-date" href="profile.html" data-back data-d="16"><span class="prof-date-num">16</span><img src="assets/profile/day-dot.svg" width="32" height="32" alt="" /></a>
                <a class="prof-date" href="profile.html" data-back data-d="17"><span class="prof-date-num">17</span><img src="assets/profile/day-empty.svg" width="32" height="32" alt="" /></a>
                <a class="prof-date" href="profile.html" data-back data-d="18"><span class="prof-date-num">18</span><img src="assets/profile/day-dot.svg" width="32" height="32" alt="" /></a>
              </div>
            </div>

            <div class="glass prof-item" data-enter style="animation-delay:.28s">
              <div class="prof-item-row"><img src="assets/profile/navigate.svg" width="28" height="28" alt="" />
                <div class="prof-item-text"><span class="t-body">Heading to Car Wash</span><span class="t-small muted">12:00 - 12:45 PM</span></div></div>
            </div>
            <div class="glass prof-item" data-enter style="animation-delay:.34s">
              <div class="prof-item-row"><img src="assets/profile/drop.svg" width="28" height="28" alt="" />
                <div class="prof-item-text"><span class="t-body">Car Wash</span><span class="t-small muted">10:20 - 11:00 AM</span></div></div>
            </div>
            <div class="glass prof-item" data-enter style="animation-delay:.40s">
              <div class="prof-item-row"><img src="assets/profile/pin.svg" width="28" height="28" alt="" />
                <div class="prof-item-text"><span class="t-body">Gangnam Parking</span><span class="t-small muted">11:10 - 11:55 AM</span></div></div>
            </div>
            <div class="glass prof-item" data-enter style="animation-delay:.46s">
              <div class="prof-item-row"><img src="assets/profile/navigate.svg" width="28" height="28" alt="" />
                <div class="prof-item-text"><span class="t-body">Return to Office</span><span class="t-small muted">12:00 - 12:30 PM</span></div></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div></div></div>
  <script>
    // 선택된 날짜를 다시 누르면 전체 기록(profile.html)으로, 다른 날짜를 누르면 강조만 이동
    const dates = document.querySelectorAll(".prof-date");
    const pick = (d) => dates.forEach((el) => el.classList.toggle("is-selected", el.dataset.d === d));
    const q = new URLSearchParams(location.search).get("d");
    if (q && [...dates].some((el) => el.dataset.d === q)) pick(q);
    dates.forEach((el) => el.addEventListener("click", (e) => {
      if (el.classList.contains("is-selected")) return; // 링크 그대로 → profile.html
      e.preventDefault();
      pick(el.dataset.d);
      history.replaceState(null, "", "?d=" + el.dataset.d);
    }));
  </script>
</body>
</html>
