<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161616" />
  <title>Map · charge points — 산디종</title>
  <link rel="stylesheet" href="https://use.typekit.net/cbs4srk.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/map-search-points.css" />
  <script src="js/app.js"></script>
</head>
<body data-tab="schedule">
  <div class="stage"><div class="phone-scaler"><div class="phone">
    <main class="screen map-screen map-points">

      <!-- 지도 + 충전소 마커 -->
      <div class="map-layer">
        <div class="map-bg"><img src="assets/map/map-bg.png" alt="" /></div>

        <a href="map-route.html" class="cp cp--cluster" aria-label="Charge Point (2)">
          <span class="cp-badge"><span class="cp-num">2</span></span>
          <span class="cp-name">Charge Point</span>
        </a>
        <a href="map-route.html" class="cp cp--single" aria-label="Charge Point, Parkview A3">
          <span class="cp-dot"><img src="assets/map-search-points/point-dot.svg" width="35.4" height="35.4" alt="" /></span>
          <span class="cp-text">
            <span class="cp-name">Charge Point</span>
            <span class="cp-sub">Parkview A3</span>
          </span>
        </a>
        <a href="map-route.html" class="cp cp--small" aria-label="Charge Point (2)">
          <span class="cp-badge"><span class="cp-num">2</span></span>
        </a>

        <div class="me"><img class="me-core" src="assets/map-search-points/location-dot.svg" width="78" height="78" alt="내 위치" /></div>
      </div>

      <!-- 뒤로가기 -->
      <a href="map-search.html" class="map-back icon-btn" data-back aria-label="뒤로">
        <img src="assets/map-search-points/back-btn.svg" width="108" height="88" alt="" />
      </a>

      <!-- 오른쪽 버튼 (충전소 필터 켜짐) -->
      <div class="map-tools">
        <button class="map-tool icon-btn" aria-label="경고">
          <span class="map-tool-warn"><img src="assets/map-search-points/warning.svg" width="19.645" height="19.645" alt="" /></span>
        </button>
        <button class="map-tool map-tool--on icon-btn" aria-label="충전소" aria-pressed="true">
          <img src="assets/map-search-points/fuel-dark.svg" width="14.55" height="15.716" alt="" />
        </button>
        <button class="map-tool icon-btn" aria-label="집">
          <img src="assets/map-search-points/house.svg" width="28" height="28" alt="" />
        </button>
      </div>

      <!-- 하단 시트 -->
      <section class="map-sheet glass">
        <div class="sheet-stops">
          <div class="sheet-loc">
            <img src="assets/map-search-points/navigate.svg" width="28" height="28" alt="" />
            <div class="sheet-loc-text">
              <span class="t-body">My Location</span>
              <span class="t-caption muted">Airport P3</span>
            </div>
          </div>
          <button class="sheet-add press" type="button">
            <span class="sheet-add-icon"><img src="assets/map-search-points/plus.svg" width="14.4" height="14.4" alt="" /></span>
            <span class="t-body">Add Stop</span>
          </button>
        </div>
        <img class="sheet-divider" src="assets/map-search-points/divider.svg" width="338" height="0.5" alt="" />
        <div class="sheet-foot">
          <div class="sheet-eta">
            <img src="assets/map-search-points/star.svg" width="12" height="28" alt="" />
            <div class="sheet-eta-text">
              <span class="sheet-eta-min">0 min</span>
              <span class="t-caption">0 km</span>
            </div>
          </div>
          <button class="sheet-price" type="button" disabled>$15</button>
        </div>
      </section>

    </main>
  </div></div></div>
</body>
</html>
